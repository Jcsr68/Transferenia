<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbfaf7">
<title>Datos para transferencia</title>
<style>
  :root {
    --bg:#fbfaf7;
    --card:#ffffff;
    --ink:#171717;
    --muted:#77736b;
    --gold:#b28a43;
    --line:#e8e2d7;
  }
  * { box-sizing:border-box; }
  body {
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:grid;
    place-items:center;
    padding:24px 16px;
  }
  main {
    width:min(100%, 480px);
    background:var(--card);
    border:1px solid var(--line);
    border-radius:28px;
    padding:34px 24px 26px;
    box-shadow:0 18px 50px rgba(0,0,0,.06);
  }
  .logo-wrap {
    display:flex;
    justify-content:center;
    margin-bottom:24px;
  }
  .logo {
    width:118px;
    height:118px;
    object-fit:contain;
    border-radius:18px;
  }
  .eyebrow {
    margin:0 0 7px;
    color:var(--gold);
    font-size:12px;
    font-weight:700;
    letter-spacing:.22em;
    text-align:center;
  }
  h1 {
    margin:0;
    font-family:Georgia,"Times New Roman",serif;
    font-size:31px;
    font-weight:500;
    text-align:center;
    letter-spacing:.01em;
  }
  .rule {
    width:44px;
    height:1px;
    background:var(--gold);
    margin:18px auto 28px;
  }
  .field {
    padding:18px 0;
    border-top:1px solid var(--line);
  }
  .field:first-of-type { border-top:0; }
  label {
    display:block;
    margin-bottom:8px;
    color:var(--muted);
    font-size:11px;
    font-weight:700;
    letter-spacing:.17em;
  }
  .value {
    font-size:20px;
    font-weight:650;
    letter-spacing:.025em;
    overflow-wrap:anywhere;
  }
  .value.clabe {
    font-variant-numeric:tabular-nums;
    letter-spacing:.035em;
  }
  button {
    width:100%;
    margin-top:13px;
    border:1px solid var(--gold);
    border-radius:14px;
    background:#fff;
    color:var(--ink);
    padding:13px 16px;
    font-size:15px;
    font-weight:650;
    cursor:pointer;
    transition:.15s ease;
  }
  button:active {
    transform:scale(.99);
    background:#faf6ee;
  }
  .status {
    min-height:21px;
    margin:16px 0 0;
    color:var(--gold);
    text-align:center;
    font-size:13px;
    font-weight:600;
  }
  footer {
    margin-top:10px;
    color:var(--muted);
    text-align:center;
    font-family:Georgia,"Times New Roman",serif;
    font-size:13px;
    letter-spacing:.06em;
  }
</style>
</head>

<script>
async function copiar(texto, mensaje) {
  const status = document.getElementById('status');
  try {
    await navigator.clipboard.writeText(texto);
    status.textContent = '✓ ' + mensaje;
  } catch (e) {
    const area = document.createElement('textarea');
    area.value = texto;
    area.style.position = 'fixed';
    area.style.opacity = '0';
    document.body.appendChild(area);
    area.select();
    document.execCommand('copy');
    area.remove();
    status.textContent = '✓ ' + mensaje;
  }
  clearTimeout(window._msgTimer);
  window._msgTimer = setTimeout(() => status.textContent = '', 2200);
}
